# ==============================================================================
# Test Configuration — MySQL Only
# ==============================================================================
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/authportal?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration

# Test OAuth2 Client Registration
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:test-client-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:test-client-secret}

# Test JWT secret fallback if not in environment
app.jwt.secret=${JWT_SECRET:54686973497341546573745365637265744B6579466F72556E697454657374696E67507572706F7365734F6E6C793132}
app.jwt.expiration-ms=3600000

app.cors.allowed-origins=http://localhost:5173

app.auth.institutional-domain=rguktn.ac.in
app.auth.student-pattern=^[Nn]\\d{6}@rguktn\\.ac\\.in$
app.auth.teacher-allowed-emails=teacher1@rguktn.ac.in,teacher2@rguktn.ac.in

# Multipart & Storage Configuration for Testing
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=20MB
app.storage.base-path=target/test-storage


