# ==============================================================================
# AuthPortal Diagnostic & Performance Monitoring Profile
# Activate via: --spring.profiles.active=performance
# Strictly for local diagnostics, thread inspection, and capacity profiling.
# ==============================================================================

# Actuator Endpoints Exposure
management.endpoints.web.exposure.include=health,metrics,prometheus,threaddump
management.endpoints.web.exposure.exclude=env,configprops,beans,mappings,liquibase,flyway,conditions,heapdump,sessions

# Health and Metrics Details
management.endpoint.health.show-details=always
management.endpoint.metrics.enabled=true
management.endpoint.prometheus.enabled=true
management.endpoint.threaddump.enabled=true

# Spring Data JPA Repository Metrics (Automatic timing of repository invocations)
spring.data.repository.autotime.enabled=true

# Hibernate Statistics & Metrics (Published to Micrometer)
# Note: Provides detailed statement & query counts for diagnostics with minimal local overhead.
spring.jpa.properties.hibernate.generate_statistics=true

# HikariCP Diagnostic & JMX Registration
spring.datasource.hikari.register-mbeans=true
# Controlled Capacity Experiment: Restored maximum pool size to baseline optimal 15
spring.datasource.hikari.maximum-pool-size=15

# Percentile histograms for latency analysis in metrics & Prometheus
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.percentiles-histogram.hikaricp.connections.acquire=true
management.metrics.distribution.percentiles-histogram.spring.data.repository.invocations=true
management.metrics.distribution.percentiles[http.server.requests]=0.5,0.9,0.95,0.99
management.metrics.distribution.percentiles[hikaricp.connections.acquire]=0.5,0.9,0.95,0.99
