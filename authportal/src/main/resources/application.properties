spring.application.name=authportal
server.port=${PORT:8080}
# Trust reverse-proxy headers (Render / Cloudflare) so OAuth2 redirect URIs use https
server.forward-headers-strategy=framework

# Automatically load local .env file if present (native Spring Boot feature)
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

# ==============================================================================
# Database Configuration (MySQL)
# ==============================================================================
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/authportal?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==============================================================================
# JPA / Hibernate Configuration
# ==============================================================================
spring.jpa.hibernate.ddl-auto=validate 
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ==============================================================================
# Flyway Database Migration Configuration
# ==============================================================================
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration

# ==============================================================================
# Spring Security OAuth2 Client (Google)
# ==============================================================================
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

# ==============================================================================
# JWT Configuration
# Note: Zero hard-coded default signing secret. Supplied strictly via environment.
# ==============================================================================
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION:86400000}

# ==============================================================================
# CORS & Frontend Integration
# ==============================================================================
app.cors.allowed-origins=${FRONTEND_URL:http://localhost:5173}

# ==============================================================================
# Institutional Domain & Role Rules
# ==============================================================================
app.auth.institutional-domain=rguktn.ac.in
app.auth.student-pattern=^[Nn]\\d{6}@rguktn\\.ac\\.in$
app.auth.teacher-allowed-emails=${TEACHER_ALLOWED_EMAILS:}
app.auth.google-admin-emails=${GOOGLE_ADMIN_EMAILS:uday@rguktn.ac.in,kampadevaselvaraj@gmail.com,devaselvaraj17@gmail.com}

# ==============================================================================
# Multipart File Upload & Submission Storage Configuration
# ==============================================================================
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=500MB
app.storage.base-path=${STORAGE_PATH:storage}

