services:
  - type: web
    name: authportal-backend
    runtime: docker
    dockerfilePath: ./authportal/Dockerfile
    dockerContext: ./authportal
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 8080
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_USERNAME
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION
        value: 86400000
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: TEACHER_ALLOWED_EMAILS
        sync: false
      - key: STORAGE_PATH
        value: /app/storage
